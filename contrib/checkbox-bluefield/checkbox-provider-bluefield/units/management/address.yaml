id: bluefield/management/tmfifo-address
summary: Verify the expected DPU tmfifo address is assigned
description: |
  Discover tmfifo through virtio_net under bf-tmfifo and compare its assigned
  addresses with BLUEFIELD_EXPECTED_TMFIFO_ADDRESS. Require the exact address
  and prefix; allow extra addresses. Capture actual interface name and addresses.
  Missing or ambiguous interfaces, missing addresses and invalid inputs fail.
  This read-only check does not require host RShim ownership or connectivity.
plugin: shell
estimated_duration: 1
environ:
  - BLUEFIELD_EXPECTED_TMFIFO_ADDRESS
command: bluefield_tmfifo_address.py
