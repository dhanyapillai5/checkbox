id: bluefield/management/expected-interfaces
summary: Verify DPU management interfaces by backing driver identity
description: |
  Discover management interfaces using driver and optional immediate parent
  driver identities from BLUEFIELD_EXPECTED_MANAGEMENT. Report actual names
  without relying on fixed naming. Missing or ambiguous interfaces and invalid
  inputs fail. This read-only check does not assert addresses, routes,
  connectivity or host RShim availability.
plugin: shell
estimated_duration: 1
environ:
  - BLUEFIELD_EXPECTED_MANAGEMENT
command: bluefield_management.py
