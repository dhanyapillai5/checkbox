unit: test plan
id: bluefield-image-smoke
name: BlueField image smoke
description: |
  Run single-DPU image checks.
include:
  - com.canonical.certification::disk/detect
  - com.canonical.certification::memory/info
  - com.canonical.certification::services/no-failed-units
  - com.canonical.certification::miscellanea/oops
  - com.canonical.certification::miscellanea/oops_results.log
  - bluefield/cloud-init/completed
  - bluefield/network/deployment-config
  - bluefield/doca/device-query
  - bluefield/services/required-state
  - bluefield/services/enablement
  - bluefield/ovs/initialization
  - bluefield/image/config-settings
  - bluefield/kernel/running-release
  - bluefield/kernel/boot-arguments
  - bluefield/packages/required-inventory
  - bluefield/packages/required-holds
  - bluefield/packages/expected-conflicts
  - bluefield/image/absent-files
  - bluefield/image/release-marker
  - bluefield/modules/required-loaded
  - bluefield/pci/expected-bindings
  - bluefield/interfaces/expected-roles
  - bluefield/management/expected-interfaces
  - bluefield/management/tmfifo-address-trial
bootstrap_include:
  - com.canonical.certification::executable
