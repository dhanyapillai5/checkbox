id: bluefield/services/required-state
summary: Verify required services reached configured runtime states
description: |
  BLUEFIELD_REQUIRED_SERVICES is a whitespace-separated list of
  unit.service:active:running or unit.service:active:exited expectations.
  Require loaded units, exact active/substates and successful Result. Query each
  unit with a 30-second timeout. Does not start/restart services or assert their
  functional behavior, enablement, historical retries or OVS configuration.
plugin: shell
estimated_duration: 2
environ:
  - BLUEFIELD_REQUIRED_SERVICES
command: bluefield_services.py
