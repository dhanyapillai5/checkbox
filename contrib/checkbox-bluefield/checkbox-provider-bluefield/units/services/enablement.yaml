id: bluefield/services/enablement
summary: Verify candidate service and timer enablement policy
description: |
  Read BLUEFIELD_SERVICE_ENABLEMENT as unique unit.service:enabled|disabled or
  unit.timer:enabled|disabled tokens. Query each unit independently with read-only
  systemctl is-enabled, including SysV-backed services. Require the exact state;
  missing, static, masked or unexpected states fail. Does not change services.
plugin: shell
estimated_duration: 13
environ:
  - BLUEFIELD_SERVICE_ENABLEMENT
command: bluefield_service_enablement.py
