id: bluefield/cloud-init/completed
summary: Verify cloud-init completion and classify recorded issues
description: |
  Wait up to 120 seconds for cloud-init, then collect JSON status and cloud-id.
  Require completion and BLUEFIELD_EXPECTED_DATASOURCE. Only reviewed early MAAS
  reporting warnings with verified deployment address/default route and exact
  early missing-NIC rename warnings with verified MAAS Netplan can pass. Other
  issues, timeouts and missing inputs fail. This read-only assertion does not
  establish resulting user, SSH-key or network configuration.
plugin: shell
user: root
estimated_duration: 2
environ:
  - BLUEFIELD_EXPECTED_DATASOURCE
  - BLUEFIELD_MAAS_NETWORK_CONFIG
command: bluefield_cloud_init.py
