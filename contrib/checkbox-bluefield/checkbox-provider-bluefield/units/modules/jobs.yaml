id: bluefield/modules/required-loaded
summary: Verify required DPU kernel modules are loaded
description: |
  Check /proc/modules for every name in BLUEFIELD_REQUIRED_MODULES supplied by
  the caller. Missing or invalid input and missing modules fail the check.
  This read-only assertion does not load modules, establish device bindings
  or exercise RDMA traffic. Built-in drivers are not listed in /proc/modules.
plugin: shell
estimated_duration: 1
environ:
  - BLUEFIELD_REQUIRED_MODULES
command: bluefield_modules.py
